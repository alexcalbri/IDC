ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        host = ${?HOST}
    }
    application {
        modules = [ com.ideasdeveloper.idc.server.app.ApplicationKt.module ];
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/idc"
    url = ${?DB_URL}
    user = "idc"
    user = ${?DB_USER}
    password = ${DB_PASSWORD}
    driver = "org.postgresql.Driver"
    maxPoolSize = 10
    maxPoolSize = ${?DB_POOL_SIZE}
}

tenant {
    databases = "[]"
    databases = ${?TENANT_DATABASES_JSON}
    defaultSchema = "public"
    defaultSchema = ${?DEFAULT_SCHEMA}
}
auth {
    sessionLifetimeSeconds = 3600
    sessionLifetimeSeconds = ${?SESSION_LIFETIME_SECONDS}
}
